[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-repro-harness"
version = "0.1.0"
description = "Execution metadata and output-location detection for RL reproductions"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "RL Reproduction"]]

[project.scripts]
rl-harness = "rl_repro_harness.cli:main"

[tool.setuptools.packages.find]
include = ["rl_repro_harness*"]
